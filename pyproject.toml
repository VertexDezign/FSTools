[project]
name = "fstools"
version = "0.1.0"
description = "Farming Simulator 25 modding helpers for Linux"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
fs = "fstools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fstools"]
